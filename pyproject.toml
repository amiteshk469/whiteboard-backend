[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "whiteboard-backend"
version = "0.1.0"
description = "FastAPI and Socket.IO backend for a collaborative whiteboard"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "pymongo>=4.13,<5",
  "python-socketio>=5.13,<6",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "aiohttp>=3.12,<4",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
